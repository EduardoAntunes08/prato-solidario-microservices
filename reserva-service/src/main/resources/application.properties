spring.application.name=reserva-service
spring.profiles.active=dev
spring.jpa.open-in-view=false

# Porta aleatoria: permite subir varias instancias do mesmo microsservico.
server.port=0

# Faz o Spring respeitar os cabecalhos X-Forwarded-* enviados pelo gateway.
# Sem isso, o header Location do POST sairia com o host e a porta aleatoria
# desta instancia; com isso, sai com a URL publica do gateway.
server.forward-headers-strategy=framework

eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Endereco com que este servico se registra no Eureka.
# Sem isso o Eureka registra o nome de rede da maquina (ex.: PC.mshome.net).
# O resolvedor DNS do Netty, usado pelo API Gateway, nao resolve esse tipo de
# nome e toda rota do gateway passa a falhar com 500 (UnknownHostException).
# Como a solucao roda toda na mesma maquina, localhost e sempre resolvivel.
eureka.instance.hostname=localhost

# Busca o registro do Eureka a cada 5s (padrao: 30s). Encurta a janela, logo
# apos a subida, em que este servico ainda nao conhece o doacao-service e a
# primeira chamada Feign falharia com "Load balancer does not contain an
# instance" — falha que, com o circuito configurado abaixo, ja seria suficiente
# para abri-lo.
eureka.client.registry-fetch-interval-seconds=5

# Swagger UI agregado (recomendado): http://localhost:8082/swagger-ui.html
# Direto neste servico: http://localhost:<porta-sorteada>/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------
# Circuit Breaker da comunicacao com o doacao-service
# ---------------------------------------------------------------------

# Monitora as ultimas 3 chamadas
resilience4j.circuitbreaker.instances.atualizarDoacao.slidingWindowSize=3

# Tipo da janela: por quantidade de chamadas
# COUNT_BASED = ultimas N chamadas / TIME_BASED = ultimos N segundos
resilience4j.circuitbreaker.instances.atualizarDoacao.slidingWindowType=COUNT_BASED

# So comeca a calcular a taxa de falha apos pelo menos 2 chamadas
resilience4j.circuitbreaker.instances.atualizarDoacao.minimumNumberOfCalls=2

# Abre o circuito quando a taxa de falhas atingir 50%
resilience4j.circuitbreaker.instances.atualizarDoacao.failureRateThreshold=50

# Tempo que o circuito permanece OPEN antes de ir para HALF_OPEN
resilience4j.circuitbreaker.instances.atualizarDoacao.waitDurationInOpenState=50s

# Em HALF_OPEN, permite 2 chamadas de teste
resilience4j.circuitbreaker.instances.atualizarDoacao.permittedNumberOfCallsInHalfOpenState=2

# Erro de negocio nao e falha de comunicacao: nao deve contar para abrir o
# circuito. Atencao: ignore-exceptions so afeta a contagem de falhas — o
# fallbackMethod continua sendo chamado. Quem garante que um 404 continua 404
# e um 409 continua 409 e o repasse feito em ReservaController.
resilience4j.circuitbreaker.instances.atualizarDoacao.ignore-exceptions[0]=br.com.fiap.ms.reserva.exception.ResourceNotFoundException
resilience4j.circuitbreaker.instances.atualizarDoacao.ignore-exceptions[1]=br.com.fiap.ms.reserva.exception.DoacaoIndisponivelException
resilience4j.circuitbreaker.instances.atualizarDoacao.ignore-exceptions[2]=br.com.fiap.ms.reserva.exception.ReservaFinalizadaException
resilience4j.circuitbreaker.instances.atualizarDoacao.ignore-exceptions[3]=br.com.fiap.ms.reserva.exception.ReservaAtivaException

# Timeouts curtos: o circuito abre rapido na demonstracao
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=3000
